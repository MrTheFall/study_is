openapi: 3.0.3
info:
  title: Krusty Crab CRM API
  description: |
    API для системы управления рестораном "Красти Крабс"
    
    Система предназначена для автоматизации бизнес-процессов ресторана:
    - Управление заказами и клиентами
    - Контроль меню и ингредиентов
    - Управление сотрудниками и рабочими сменами
    - Финансовый учет и отчётность
    - Программы лояльности
    - Мониторинг качества обслуживания
  version: 1.0.0
  contact:
    name: Krusty Crab Support

servers:
  - url: http://localhost:13228/api
    description: Local development server

tags:
  - name: auth
    description: Аутентификация и авторизация
  - name: clients
    description: Управление клиентами
  - name: menu
    description: Управление меню
  - name: orders
    description: Управление заказами
  - name: couriers
    description: Управление курьерами
  - name: payments
    description: Обработка платежей
  - name: reviews
    description: Отзывы клиентов
  - name: inventory
    description: Управление складом ингредиентов
  - name: employees
    description: Управление персоналом
  - name: shifts
    description: Управление рабочими сменами
  - name: kitchen
    description: Очередь заказов для кухни
  - name: analytics
    description: Аналитика и отчеты
  - name: audit
    description: Журнал действий сотрудников и изменений заказов
  - name: finance
    description: Финансы и расходы

paths:
  # ========== AUTH ==========
  /auth/login/client:
    post:
      tags:
        - auth
      summary: Вход клиента
      description: Аутентификация клиента по email и паролю
      operationId: loginClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT токен доступа
                  userType:
                    type: string
                    enum: [CLIENT]
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Клиент не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login/employee:
    post:
      tags:
        - auth
      summary: Вход сотрудника
      description: Аутентификация сотрудника по логину и паролю
      operationId: loginEmployee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
                - password
              properties:
                login:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Успешная аутентификация
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT токен доступа
                  userType:
                    type: string
                    enum: [EMPLOYEE]
        '401':
          description: Неверные учетные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Сотрудник не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - auth
      summary: Получить информацию о текущем пользователе
      description: Получение информации о текущем аутентифицированном пользователе
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              schema:
                type: object
                properties:
                  userId:
                    type: integer
                  username:
                    type: string
                  userType:
                    type: string
                    enum: [CLIENT, EMPLOYEE]
                  role:
                    type: string
                    nullable: true
                    description: Роль сотрудника (только для EMPLOYEE)
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ========== CLIENTS ==========
  # ========== CLIENTS ==========
  /clients:
    post:
      tags:
        - clients
      summary: Регистрация нового клиента
      description: Создание нового клиента в системе (FR-005, FR-006). Публичный эндпоинт, не требует аутентификации.
      operationId: registerClient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientRegistrationRequest'
      responses:
        '201':
          description: Клиент успешно зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Клиент с таким email или телефоном уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags:
        - clients
      summary: Получить список клиентов
      description: Получение списка всех клиентов (только для управляющего)
      operationId: getAllClients
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список клиентов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Client'

  /clients/lookup:
    get:
      tags:
        - clients
      summary: Найти клиента по телефону или email
      description: Поиск клиента по телефону/email (для кассира/управляющего)
      operationId: lookupClient
      security:
        - bearerAuth: []
      parameters:
        - name: phone
          in: query
          description: Телефон клиента (точное совпадение)
          schema:
            type: string
        - name: email
          in: query
          description: Email клиента (точное совпадение)
          schema:
            type: string
      responses:
        '200':
          description: Клиент найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{clientId}:
    get:
      tags:
        - clients
      summary: Получить информацию о клиенте
      description: Получение информации о клиенте по ID
      operationId: getClientById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: Информация о клиенте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - clients
      summary: Обновить данные клиента
      description: Обновление персональных данных клиента (FR-006)
      operationId: updateClient
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdateRequest'
      responses:
        '200':
          description: Данные клиента обновлены
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Client'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /clients/{clientId}/orders:
    get:
      tags:
        - clients
      summary: Получить историю заказов клиента
      description: Получение истории заказов клиента (FR-007)
      operationId: getClientOrders
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      responses:
        '200':
          description: История заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /clients/{clientId}/password:
    patch:
      tags:
        - clients
      summary: Сменить пароль клиента
      description: Смена пароля клиента (UC-8). Требует текущий пароль.
      operationId: changeClientPassword
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ClientId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Пароль изменен
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========== MENU ==========
  /menu:
    get:
      tags:
        - menu
      summary: Получить меню
      description: Получение актуального меню с ценами и составом блюд (FR-002)
      operationId: getMenu
      parameters:
        - name: available
          in: query
          description: Показать только доступные блюда
          schema:
            type: boolean
            default: false
        - name: search
          in: query
          description: Поиск по названию
          schema:
            type: string
      responses:
        '200':
          description: Список блюд меню
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MenuItem'

    post:
      tags:
        - menu
      summary: Создать новое блюдо
      description: Создание нового блюда в меню (FR-016, только для управляющего)
      operationId: createMenuItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemCreateRequest'
      responses:
        '201':
          description: Блюдо создано
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'

  /menu/{menuItemId}:
    get:
      tags:
        - menu
      summary: Получить информацию о блюде
      description: Получение детальной информации о блюде
      operationId: getMenuItemById
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      responses:
        '200':
          description: Информация о блюде
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - menu
      summary: Обновить блюдо
      description: Обновление информации о блюде (FR-016, только для управляющего)
      operationId: updateMenuItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuItemCreateRequest'
      responses:
        '200':
          description: Блюдо обновлено
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - menu
      summary: Удалить блюдо
      description: Удаление блюда из меню (FR-016, только для управляющего)
      operationId: deleteMenuItem
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MenuItemId'
      responses:
        '204':
          description: Блюдо удалено
        '404':
          $ref: '#/components/responses/NotFound'

  # ========== ORDERS ==========
  /orders:
    post:
      tags:
        - orders
      summary: Создать заказ
      description: Создание нового заказа (FR-001, FR-008)
      operationId: placeOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Заказ создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  orderId:
                    type: integer
                    description: ID созданного заказа
        '400':
          $ref: '#/components/responses/BadRequest'

    get:
      tags:
        - orders
      summary: Получить список заказов
      description: Получение списка заказов (для управляющего)
      operationId: getAllOrders
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Фильтр по статусу
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: clientId
          in: query
          description: Фильтр по клиенту
          schema:
            type: integer
      responses:
        '200':
          description: Список заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'

  /orders/{orderId}:
    get:
      tags:
        - orders
      summary: Получить информацию о заказе
      description: Получение детальной информации о заказе (FR-003)
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Информация о заказе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - orders
      summary: Обновить статус заказа
      description: Обновление статуса заказа (FR-008, FR-010, FR-013)
      operationId: updateOrderStatus
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/OrderStatus'
      responses:
        '200':
          description: Статус заказа обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/payment-method:
    patch:
      tags:
        - orders
      summary: Обновить способ оплаты заказа
      description: Обновление выбранного способа оплаты для заказа (UC-2)
      operationId: updateOrderPaymentMethod
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - paymentMethod
              properties:
                paymentMethod:
                  $ref: '#/components/schemas/PaymentMethod'
      responses:
        '200':
          description: Заказ обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/{orderId}/items:
    get:
      tags:
        - orders
      summary: Получить позиции заказа
      description: Получение списка позиций (строк) заказа.
      operationId: getOrderItems
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Список позиций заказа
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderItem'
        '404':
          $ref: '#/components/responses/NotFound'

  /orders/items/batch:
    post:
      tags:
        - orders
      summary: Получить позиции нескольких заказов
      description: Батч-загрузка позиций заказов (для UI списков и поиска)
      operationId: getOrderItemsBatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderItemsBatchRequest'
      responses:
        '200':
          description: Позиции заказов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderItem'
        '400':
          $ref: '#/components/responses/BadRequest'

  /orders/{orderId}/courier:
    patch:
      tags:
        - orders
      summary: Назначить курьера на заказ
      description: Назначение/снятие курьера для delivery-заказа (UC-2).
      operationId: assignCourierToOrder
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignCourierRequest'
      responses:
        '200':
          description: Заказ обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ========== COURIERS ==========
  /couriers:
    get:
      tags:
        - couriers
      summary: Получить список курьеров
      description: Получение списка всех курьеров (для управляющего)
      operationId: getAllCouriers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список курьеров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Courier'

    post:
      tags:
        - couriers
      summary: Создать курьера
      description: Создание нового курьера (для управляющего)
      operationId: createCourier
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourierCreateRequest'
      responses:
        '201':
          description: Курьер создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courier'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Курьер с таким телефоном уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /couriers/{courierId}:
    get:
      tags:
        - couriers
      summary: Получить курьера по ID
      description: Получение информации о курьере (для управляющего)
      operationId: getCourierById
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourierId'
      responses:
        '200':
          description: Информация о курьере
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courier'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - couriers
      summary: Обновить курьера
      description: Обновление информации о курьере (для управляющего)
      operationId: updateCourier
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourierCreateRequest'
      responses:
        '200':
          description: Курьер обновлен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Courier'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Курьер с таким телефоном уже существует
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - couriers
      summary: Удалить курьера
      description: Удаление курьера (для управляющего)
      operationId: deleteCourier
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourierId'
      responses:
        '204':
          description: Курьер удален
        '404':
          $ref: '#/components/responses/NotFound'

  # ========== PAYMENTS ==========
  /payments:
    get:
      tags:
        - payments
      summary: Получить список платежей
      description: История платежей с пагинацией (для клиента — только по своим заказам)
      operationId: getPayments
      security:
        - bearerAuth: []
      parameters:
        - name: success
          in: query
          description: Фильтр по результату платежа
          schema:
            type: boolean
        - name: from
          in: query
          description: Начало периода
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          description: Конец периода
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          description: Максимум записей
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 500
        - name: offset
          in: query
          description: Смещение (пагинация)
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: История платежей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'

    post:
      tags:
        - payments
      summary: Обработать платеж
      description: Обработка платежа за заказ (FR-019)
      operationId: processPayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Платеж обработан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          $ref: '#/components/responses/BadRequest'

  /payments/online/start:
    post:
      tags:
        - payments
      summary: Инициировать онлайн-оплату (3-D Secure)
      description: Создает сессию онлайн-оплаты и возвращает ссылку на страницу банка (ACS)
      operationId: startOnlinePayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnlinePaymentStartRequest'

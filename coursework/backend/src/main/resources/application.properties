spring.application.name=krusty-crab
server.port=13228

spring.datasource.url=jdbc:postgresql://localhost:5433/krusty_crm
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# SpringDoc OpenAPI configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# JWT Configuration
jwt.secret=${JWT_SECRET:oBqt0p6phCJK7idu4Q5iBMzJ3WYwJwuVuPzxTWqaoDQ}
jwt.expiration=86400000

# Frontend Configuration
frontend.url=${FRONTEND_URL:http://localhost:5173,http://ubuntu:5173}

# Bank simulator configuration
bank.simulator.base-url=${BANK_SIMULATOR_BASE_URL:http://localhost:${server.port}}
bank.simulator.mode=${BANK_SIMULATOR_MODE:http}
bank.simulator.secret=${BANK_SIMULATOR_SECRET:bank-simulator-secret}
bank.simulator.merchant-id=${BANK_SIMULATOR_MERCHANT_ID:krusty-crab-demo}
bank.simulator.challenge-ttl-minutes=${BANK_SIMULATOR_TTL:10}
bank.simulator.otp=${BANK_SIMULATOR_OTP:123456}
bank.simulator.notify.enabled=${BANK_SIMULATOR_NOTIFY_ENABLED:true}

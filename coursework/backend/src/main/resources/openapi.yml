        '200':
          description: История выплат зарплат
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalaryPayment'

    post:
      tags:
        - finance
      summary: Зафиксировать выплату зарплаты
      operationId: createSalaryPayment
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaryPaymentCreateRequest'
      responses:
        '201':
          description: Выплата создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaryPayment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен доступа. Получите токен через /auth/login/client или /auth/login/employee

  parameters:
    ClientId:
      name: clientId
      in: path
      required: true
      schema:
        type: integer
      description: ID клиента

    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: integer
      description: ID заказа

    MenuItemId:
      name: menuItemId
      in: path
      required: true
      schema:
        type: integer
      description: ID блюда

    CourierId:
      name: courierId
      in: path
      required: true
      schema:
        type: integer
      description: ID курьера

  responses:
    BadRequest:
      description: Некорректный запрос
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Client:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        defaultAddress:
          type: string
        registeredAt:
          type: string
          format: date
        loyaltyPoints:
          type: integer
          minimum: 0

    ClientRegistrationRequest:
      type: object
      required:
        - name
        - phone
        - email
        - password
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
        defaultAddress:
          type: string

    ClientUpdateRequest:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        defaultAddress:
          type: string

    ChangePasswordRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 6

    Courier:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        vehicleInfo:
          type: string
        available:
          type: boolean
        busy:
          type: boolean

    CourierCreateRequest:
      type: object
      required:
        - name
        - phone
      properties:
        name:
          type: string
        phone:
          type: string
        vehicleInfo:
          type: string
        available:
          type: boolean

    MenuItem:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
        available:
          type: boolean
        prepTimeMinutes:
          type: integer
          minimum: 0

    MenuItemCreateRequest:
      type: object
      required:
        - name
        - price
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: decimal
          minimum: 0
        available:
          type: boolean
        prepTimeMinutes:
          type: integer
          minimum: 0

    Order:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        createdByEmployeeId:
          type: integer
          nullable: true
        acceptedByEmployeeId:
          type: integer
          nullable: true
        type:
          $ref: '#/components/schemas/OrderType'
        status:
          $ref: '#/components/schemas/OrderStatus'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        preparingAt:
          type: string
          format: date-time
          nullable: true
        readyAt:
          type: string
          format: date-time
          nullable: true
        cookingDurationSeconds:
          type: integer
          minimum: 0
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        totalAmount:
          type: number
          format: decimal
        courierId:
          type: integer
          nullable: true
        courier:
          $ref: '#/components/schemas/Courier'
          nullable: true
        deliveredAt:
          type: string
          format: date-time
          nullable: true
        deliveryAddress:
          type: string
          nullable: true

    OrderType:
      type: string
      enum:
        - dine_in
        - takeout
        - delivery

    OrderStatus:
      type: string
      enum:
        - pending
        - confirmed
        - preparing
        - ready
        - delivering
        - delivered
        - completed
        - cancelled

    PlaceOrderRequest:
      type: object
      required:
        - clientId
        - type
        - items
      properties:
        clientId:
          type: integer
        type:
          $ref: '#/components/schemas/OrderType'
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        deliveryAddress:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemRequest'

    OrderItemsBatchRequest:
      type: object
      required:
        - orderIds
      properties:
        orderIds:
          type: array
          minItems: 1
          maxItems: 200
          items:
            type: integer

    OrderItemRequest:
      type: object
      required:
        - menuItemId
        - quantity
      properties:
        menuItemId:
          type: integer
        quantity:
          type: integer
          minimum: 1
        unitPrice:
          type: number
          format: decimal

    OrderItem:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        menuItemId:
          type: integer
        name:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: decimal
        totalPrice:
          type: number
          format: decimal
        note:
          type: string

    AssignCourierRequest:
      type: object
      required:
        - courierId
      properties:
        courierId:
          type: integer
          nullable: true

    Payment:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        method:
          $ref: '#/components/schemas/PaymentMethod'
        amount:
          type: number
          format: decimal
        paidAt:
          type: string
          format: date-time
          nullable: true
        success:
          type: boolean

    PaymentMethod:
      type: string
      enum:
        - cash
        - card
        - online

    PaymentRequest:
      type: object
      required:
        - orderId
        - method
      properties:
        orderId:
          type: integer
        method:
          $ref: '#/components/schemas/PaymentMethod'
        simulateFailure:
          type: boolean
          description: Только для метода online - принудительно смоделировать ошибку платежа (UC-2 альтернативный поток 6а)
          default: false

    OnlinePaymentStartRequest:
      type: object
      required:
        - orderId
        - cardNumber
        - cardExpiry
        - cardCvv
      properties:
        orderId:
          type: integer
        cardNumber:
          type: string
          description: Номер карты (16 цифр, допускаются пробелы)
        cardExpiry:
          type: string
          description: Срок действия карты в формате ММ/ГГ
        cardCvv:
          type: string
          description: CVV/CVC (3-4 цифры)
        cardHolder:
          type: string
          description: Имя держателя карты
        simulateFailure:
          type: boolean
          description: Принудительно смоделировать отказ банка
          default: false

    OnlinePaymentStartResponse:
      type: object
      properties:
        sessionId:
          type: string
        orderId:
          type: integer
        amount:
          type: number
          format: decimal
        status:
          $ref: '#/components/schemas/OnlinePaymentStatus'
        redirectUrl:
          type: string
          description: Ссылка на ACS/3-D Secure страницу банка
        expiresAt:
          type: string
          format: date-time
          nullable: true

    OnlinePaymentStatus:
      type: string
      enum:
        - created
        - challenge_required
        - succeeded
        - failed
        - cancelled

    CashPaymentRequest:
      type: object
      required:
        - orderId
        - amountReceived
      properties:
        orderId:
          type: integer
        amountReceived:
          type: number
          format: decimal
          minimum: 0

    ChangeResponse:
      type: object
      properties:
        orderTotal:
          type: number
          format: decimal
        amountReceived:
          type: number
          format: decimal
        change:
          type: number
          format: decimal

    Review:
      type: object
      properties:
        id:
          type: integer
        orderId:
          type: integer
        clientId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
        createdAt:
          type: string
          format: date-time

    ReviewCreateRequest:
      type: object
      required:
        - orderId
        - clientId
        - rating
      properties:
        orderId:
          type: integer
        clientId:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string

    InventoryRecord:
      type: object
      properties:
        id:
          type: integer
        ingredientId:
          type: integer
        quantity:
          type: number
          format: decimal
        lastUpdated:
          type: string
          format: date-time

    InventoryUpdateRequest:
      type: object
      required:
        - delta
      properties:
        delta:
          type: number
          format: double
        reason:
          type: string

    LowStockItem:
      type: object
      properties:
        ingredientId:
          type: integer
        name:
          type: string
        quantity:
          type: number
          format: decimal
        minThreshold:
          type: number
          format: decimal

    InventoryTransaction:
      type: object
      properties:
        id:
          type: integer
        ingredientId:
          type: integer
        ingredientName:
          type: string
        delta:
          type: number
          format: decimal
        reason:

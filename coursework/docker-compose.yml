services:
  db:
    image: postgres:16
    container_name: kk_pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: krusty_crm
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d krusty_crm"]
      interval: 2s
      timeout: 2s
      retries: 30
    volumes:
      - kk_pg_data:/var/lib/postgresql/data
      - ./docker/db-init/00_init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./db:/docker-entrypoint-initdb.d/sql:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/krusty_crm
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_SERVLET_CONTEXT_PATH: /api
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      FRONTEND_URL: https://localhost
      BANK_SIMULATOR_MODE: internal
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "13228"

  web:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "443:443"
    depends_on:
      - backend
    volumes:
      - ./ssl:/etc/nginx/ssl:ro

volumes:
  kk_pg_data:

        source:
          type: string
        employeeId:
          type: integer
        employeeName:
          type: string
        orderId:
          type: integer
        createdAt:
          type: string
          format: date-time

    ReportView:
      type: object
      properties:
        id:
          type: integer
        employeeId:
          type: integer
        employeeName:
          type: string
        report:
          type: string
        from:
          type: string
